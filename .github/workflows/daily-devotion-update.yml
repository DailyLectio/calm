name: Update Daily Devotion

on:
  workflow_run:
    workflows: ["Generate Weekly Devotions (Fri–Thu)"]
    types: [completed]
  schedule:
    - cron: "35 8 * * *"
    - cron: "35 7 * * *"
  workflow_dispatch: {}

concurrency:
  group: daily-devotion
  cancel-in-progress: true

jobs:
  update-devotion:
    if: >
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      APP_TZ: America/New_York
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install shared generation and validation dependencies
        run: python -m pip install -r requirements-devotions.txt
      - name: Ensure today's source (generate and merge only if missing)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_PROJECT: ${{ secrets.OPENAI_PROJECT }}
          GEN_MODEL: gpt-5-mini
          GEN_FALLBACK: gpt-5-mini
          GEN_TEMP: "1"
          USCCB_STRICT: "1"
        run: python -m scripts.ensure_daily_source
      - name: Validate source feed before publication
        run: python -m scripts.validate_publication public/weeklyfeed.json
      - name: Publish today's validated devotion and archive
        run: python update_daily_devotion.py --tz "$APP_TZ" --skip-dist
      - name: Validate today's output before commit
        run: |
          python -m scripts.validate_publication public/devotions.json \
            --start "$(TZ=$APP_TZ date +%Y-%m-%d)" --days 1
      - name: Commit and push publication (including any recovered source day)
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/weeklyfeed.json public/devotions.json public/past_reflections/
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Daily devotion update for $(TZ=$APP_TZ date +%Y-%m-%d)"
          git push https://x-access-token:${GH_PAT}@github.com/${{ github.repository }}.git HEAD:main
