name: Update Daily Devotion

on:
  workflow_run:
    workflows: ["Generate Weekly Devotions (Fri–Thu)"]
    types: [completed]
  schedule:
    # Catch up after delayed/dropped scheduler events, not only overnight.
    # Current content is a read-only no-op; no generation or publisher job.
    - cron: '11,41 * * * *'
      timezone: America/New_York
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  prepare:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      needed: ${{ steps.freshness.outputs.needed }}
    concurrency:
      group: daily-preparation
      queue: max
      cancel-in-progress: false
    env:
      APP_TZ: America/New_York
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-devotions.txt
      - name: Skip only when today's full publication is already current
        id: freshness
        run: python -m scripts.daily_publication_needed --github-output
      - name: Prepare only a missing source day (never publish future tests)
        if: steps.freshness.outputs.needed == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_PROJECT: ${{ secrets.OPENAI_PROJECT }}
          GEN_MODEL: gpt-5-mini
          GEN_FALLBACK: gpt-5-mini
          GEN_TEMP: '1'
          USCCB_STRICT: '1'
        run: python -m scripts.prepare_publication --mode daily
      - uses: actions/upload-artifact@v4
        if: steps.freshness.outputs.needed == 'true'
        with:
          name: daily-candidate
          path: artifacts/candidate.json
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: prepare
    if: needs.prepare.outputs.needed == 'true'
    permissions:
      contents: write
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Shared by ALL production feed writers; only the short commit stage queues.
    concurrency:
      group: production-feed-writer
      queue: max
      cancel-in-progress: false
    env:
      APP_TZ: America/New_York
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-devotions.txt
      - uses: actions/download-artifact@v4
        with:
          name: daily-candidate
          path: artifacts
      - name: Validate, merge against fresh main, publish, retry only Git races
        run: python -m scripts.publish_feed --mode daily
      - name: Explicitly trigger validation (workflow-token pushes do not trigger push Actions)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m scripts.dispatch_validation
