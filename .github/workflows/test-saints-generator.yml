name: Test Saints Generator

on:
  push:
    paths:
      - 'scripts/generate_saints.py'
      - 'tests/test_generate_saints.py'
      - '.github/workflows/generate-saints-monthly.yml'
      - '.github/workflows/test-saints-generator.yml'
  pull_request:
    paths:
      - 'scripts/generate_saints.py'
      - 'tests/test_generate_saints.py'
      - '.github/workflows/generate-saints-monthly.yml'
      - '.github/workflows/test-saints-generator.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests beautifulsoup4
      - run: python -m unittest discover -s tests -p 'test_generate_saints.py' -v
