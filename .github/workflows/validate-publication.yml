name: Validate Publication
# New active workflow replaces the previously disabled legacy validation workflow.
on:
  push:
    paths:
      - 'public/weeklyfeed.json'
      - 'public/devotions.json'
      - 'public/saint.json'
      - 'scripts/**'
      - 'tests/**'
      - 'schemas/**'
      - 'update_daily_devotion.py'
      - 'requirements-devotions.txt'
      - '.github/workflows/**'
      - '.github/scripts/**'
  pull_request:
    paths:
      - 'public/**'
      - 'scripts/**'
      - 'tests/**'
      - 'schemas/**'
      - 'update_daily_devotion.py'
      - 'requirements-devotions.txt'
      - '.github/**'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-devotions.txt
      - name: Offline regression suite
        run: python -m unittest discover -s tests -v
      - name: Validate published and rolling feeds
        run: python -m scripts.validate_publication
