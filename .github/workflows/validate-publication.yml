name: Validate Publication

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-devotions.txt
      - name: Maintained Python syntax and conflict-marker check
        run: python -m scripts.check_maintenance
      - name: Offline regression suite
        run: python -m unittest discover -s tests -v
      - name: Validate published and rolling feeds
        run: python -m scripts.validate_publication
