name: Generate Monthly Saints JSON

on:
  # Operator-led: Codex draft -> operator review -> approved publication.
  # This optional scaffold is manual-only and never publishes saint.json.
  workflow_dispatch:
    inputs:
      start_month:
        description: "YYYY-MM for the first month (default next month)"
        required: false
        default: ""
      months:
        description: "How many months to generate (1-2 recommended)"
        required: false
        default: "1"

concurrency:
  group: saints-monthly
  cancel-in-progress: false

jobs:
  saints-monthly:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      APP_TZ: America/New_York
      VERBOSE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install -r requirements-saints.txt

      - name: Test history preservation
        run: python -m unittest discover -s tests -p 'test_generate_saints.py' -v

      - name: Generate review-only monthly draft (published saints remain unchanged)
        env:
          START_MONTH: ${{ github.event.inputs.start_month }}
          MONTHS: ${{ github.event.inputs.months || '1' }}
        run: |
          python scripts/generate_saints.py

      - name: Validate saint.json
        run: |
          test -f public/saint.json
          python - <<'PY'
          import json,sys,re
          data=json.load(open('public/saint.json','r',encoding='utf-8'))
          assert isinstance(data,list) and len(data)>0
          for row in data:
            assert 'date' in row and re.match(r'^\d{4}-\d{2}-\d{2}$', row['date'])
            for k in ['saintName','memorial','source','saintAlt1','saintAlt2','profile','link']:
              assert k in row
          print("saint.json validates with", len(data), "rows")
          PY

      - name: Retain draft for editorial review
        uses: actions/upload-artifact@v4
        with:
          name: saints-review-${{ github.run_id }}
          path: drafts/saints-*.json
          if-no-files-found: ignore
          retention-days: 30
