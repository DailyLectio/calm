name: Generate Weekly Devotions (Fri–Thu)

on:
  schedule:
    # Retry through Thursday so a transient provider/billing repair can recover
    # the Friday–Thursday window without waiting for an operator dispatch.
    # Existing dates are retained, so a completed window is a no-generation no-op.
    - cron: '5 3,9,15,21 * * 4'
      timezone: America/New_York
  workflow_dispatch:
    inputs:
      start_date:
        description: 'YYYY-MM-DD; blank = this week Friday (upcoming on Mon–Thu)'
        required: false
        default: ''
      days:
        description: 'Window length, 1–14 (default 7)'
        required: false
        default: '7'

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: weekly-preparation
      queue: max
      cancel-in-progress: false
    env:
      APP_TZ: America/New_York
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-devotions.txt
      - name: Prepare missing days and preserve reviewed overlaps
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_PROJECT: ${{ secrets.OPENAI_PROJECT }}
          GEN_MODEL: gpt-5.6-terra
          GEN_FALLBACK: gpt-5.4-mini
          GEN_TEMP: '1'
          USCCB_STRICT: '1'
          START_DATE: ${{ inputs.start_date || '' }}
          DAYS: ${{ inputs.days || '7' }}
        run: python -m scripts.prepare_publication --mode weekly
      - uses: actions/upload-artifact@v4
        with:
          name: weekly-candidate
          path: artifacts/candidate.json
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: prepare
    permissions:
      contents: write
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: production-feed-writer
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-devotions.txt
      - uses: actions/download-artifact@v4
        with:
          name: weekly-candidate
          path: artifacts
      - name: Validate and safely merge prepared data; no regeneration on retries
        run: python -m scripts.publish_feed --mode weekly
      - name: Explicitly trigger validation (workflow-token pushes do not trigger push Actions)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m scripts.dispatch_validation
